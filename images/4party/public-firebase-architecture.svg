<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">4Party public Firebase architecture</title>
  <desc id="desc">Public-safe Firebase Authentication and Cloud Firestore architecture for 4Party.</desc>
  <rect width="1200" height="680" fill="#fffaf5"/>
  <text x="72" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4a2c0a">4Party Firebase Architecture</text>
  <text x="72" y="112" font-family="Arial, sans-serif" font-size="17" fill="#7c5b3a">Android 앱에서 인증, 파티 생성, 실시간 목록 조회를 처리하는 공개용 구조도</text>

  <g font-family="Arial, sans-serif">
    <rect x="84" y="238" width="210" height="124" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text x="132" y="288" font-size="22" font-weight="700" fill="#9a3412">Android App</text>
    <text x="116" y="320" font-size="14" fill="#64748b">Kotlin 기반 화면 / 상태 처리</text>

    <rect x="406" y="164" width="230" height="116" rx="18" fill="#fffbeb" stroke="#facc15"/>
    <text x="448" y="212" font-size="20" font-weight="700" fill="#92400e">Firebase Auth</text>
    <text x="448" y="242" font-size="14" fill="#64748b">학교 이메일 로그인</text>

    <rect x="406" y="366" width="230" height="116" rx="18" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="444" y="414" font-size="20" font-weight="700" fill="#1d4ed8">Cloud Firestore</text>
    <text x="454" y="444" font-size="14" fill="#64748b">파티 / 사용자 / 탑승 정보</text>

    <rect x="764" y="148" width="144" height="86" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="806" y="184" font-size="16" font-weight="700" fill="#9a3412">users</text>
    <text x="792" y="208" font-size="12" fill="#64748b">uid, email</text>

    <rect x="764" y="278" width="144" height="86" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="808" y="314" font-size="16" font-weight="700" fill="#9a3412">parties</text>
    <text x="788" y="338" font-size="12" fill="#64748b">route, time, seats</text>

    <rect x="764" y="408" width="144" height="86" rx="14" fill="#ffffff" stroke="#fed7aa"/>
    <text x="798" y="444" font-size="16" font-weight="700" fill="#9a3412">members</text>
    <text x="790" y="468" font-size="12" fill="#64748b">partyId, userId</text>

    <rect x="988" y="278" width="144" height="86" rx="14" fill="#ecfdf5" stroke="#34d399"/>
    <text x="1020" y="314" font-size="16" font-weight="700" fill="#047857">OpenChat</text>
    <text x="1010" y="338" font-size="12" fill="#64748b">외부 채팅 연결</text>
  </g>

  <g stroke="#f97316" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M294 280 C340 250 358 222 398 222"/>
    <path d="M294 330 C340 370 358 424 398 424"/>
    <path d="M636 424 C690 424 704 451 756 451"/>
    <path d="M636 424 C690 424 704 321 756 321"/>
    <path d="M636 222 C690 222 704 191 756 191"/>
    <path d="M908 321H980"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>
  <text x="84" y="584" font-family="Arial, sans-serif" font-size="16" fill="#64748b">핵심 기여: 인증 흐름, Firestore 컬렉션 설계, 파티 생성·참여·조회, 탑승 정보 관리</text>
</svg>
