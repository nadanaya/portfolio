<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">4Party public screen flow</title>
  <desc id="desc">Public-safe recreated screen flow for a taxi ride-sharing Android app.</desc>
  <rect width="1200" height="720" fill="#fffaf5"/>
  <text x="64" y="76" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#4a2c0a">4Party Screen Flow</text>
  <text x="64" y="110" font-family="Arial, sans-serif" font-size="17" fill="#7c5b3a">기흥역과 명지대학교 구간 택시 동승 매칭 흐름을 공개용으로 재구성</text>

  <g font-family="Arial, sans-serif">
    <rect x="66" y="170" width="190" height="360" rx="26" fill="#1f2937"/>
    <rect x="82" y="214" width="158" height="270" rx="18" fill="#ffffff"/>
    <text x="120" y="254" font-size="18" font-weight="700" fill="#ea580c">4Party</text>
    <rect x="104" y="292" width="114" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="122" y="316" font-size="12" fill="#64748b">학교 이메일</text>
    <rect x="104" y="346" width="114" height="38" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="126" y="370" font-size="12" fill="#64748b">비밀번호</text>
    <rect x="104" y="406" width="114" height="34" rx="17" fill="#f97316"/>
    <text x="143" y="428" font-size="12" fill="#ffffff">로그인</text>
    <text x="112" y="572" font-size="14" font-weight="700" fill="#4a2c0a">사용자 인증</text>

    <rect x="330" y="170" width="190" height="360" rx="26" fill="#1f2937"/>
    <rect x="346" y="214" width="158" height="270" rx="18" fill="#ffffff"/>
    <text x="384" y="254" font-size="16" font-weight="700" fill="#4a2c0a">파티 목록</text>
    <rect x="368" y="286" width="114" height="60" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="386" y="312" font-size="12" fill="#9a3412">A 코스</text>
    <text x="386" y="334" font-size="12" fill="#64748b">2/4명 모집중</text>
    <rect x="368" y="362" width="114" height="60" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="386" y="388" font-size="12" fill="#9a3412">B 코스</text>
    <text x="386" y="410" font-size="12" fill="#64748b">3/4명 모집중</text>
    <text x="374" y="572" font-size="14" font-weight="700" fill="#4a2c0a">실시간 파티 조회</text>

    <rect x="594" y="170" width="190" height="360" rx="26" fill="#1f2937"/>
    <rect x="610" y="214" width="158" height="270" rx="18" fill="#ffffff"/>
    <text x="648" y="254" font-size="16" font-weight="700" fill="#4a2c0a">파티 생성</text>
    <rect x="632" y="292" width="114" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="656" y="320" font-size="12" fill="#64748b">코스 선택</text>
    <rect x="632" y="354" width="114" height="46" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="652" y="382" font-size="12" fill="#64748b">출발 시간</text>
    <rect x="632" y="416" width="114" height="34" rx="17" fill="#f97316"/>
    <text x="666" y="438" font-size="12" fill="#ffffff">만들기</text>
    <text x="650" y="572" font-size="14" font-weight="700" fill="#4a2c0a">파티 생성</text>

    <rect x="858" y="170" width="190" height="360" rx="26" fill="#1f2937"/>
    <rect x="874" y="214" width="158" height="270" rx="18" fill="#ffffff"/>
    <text x="906" y="254" font-size="16" font-weight="700" fill="#4a2c0a">참여한 파티</text>
    <rect x="896" y="292" width="114" height="78" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="914" y="320" font-size="12" fill="#9a3412">기흥역 택시</text>
    <text x="914" y="342" font-size="12" fill="#64748b">3/4명 참여</text>
    <rect x="896" y="394" width="114" height="34" rx="17" fill="#f97316"/>
    <text x="930" y="416" font-size="12" fill="#ffffff">오픈채팅</text>
    <text x="906" y="572" font-size="14" font-weight="700" fill="#4a2c0a">참여 / 연결</text>
  </g>

  <g stroke="#f97316" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M260 350H322"/>
    <path d="M524 350H586"/>
    <path d="M788 350H850"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f97316"/>
    </marker>
  </defs>
</svg>
