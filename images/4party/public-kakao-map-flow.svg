<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">4-party Kakao Map Contribution Flow</title>
  <desc id="desc">React Native client screens calling Kakao Mobility Directions API and Kakao Local API for fare/route estimation and address geocoding</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="64" y="70" width="1072" height="535" rx="18" fill="#FFFFFF" stroke="#DDD7CD" stroke-width="2"/>
  <text x="92" y="123" fill="#7A3B1E" font-family="Arial, sans-serif" font-size="30" font-weight="700">kakao-map (개인 기여 범위)</text>
  <text x="92" y="157" fill="#5F6268" font-family="Arial, sans-serif" font-size="17">4-party 팀 프로젝트 중 직접 구현·검증한 Kakao Map 연동 부분</text>

  <rect x="92" y="235" width="230" height="106" rx="10" fill="#FFF8ED" stroke="#A9562F" stroke-width="2"/>
  <text x="122" y="270" fill="#7A3B1E" font-family="Arial, sans-serif" font-size="19" font-weight="700">RideScreen.js</text>
  <text x="122" y="296" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">지도 탭으로 출발/도착</text>
  <text x="122" y="316" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">좌표 선택</text>

  <rect x="92" y="380" width="230" height="106" rx="10" fill="#FFF8ED" stroke="#A9562F" stroke-width="2"/>
  <text x="122" y="415" fill="#7A3B1E" font-family="Arial, sans-serif" font-size="19" font-weight="700">utils/kakao.js</text>
  <text x="122" y="441" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">주소 문자열을</text>
  <text x="122" y="461" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">위경도로 변환</text>

  <rect x="410" y="235" width="240" height="106" rx="10" fill="#E6EDF6" stroke="#315A8A" stroke-width="2"/>
  <text x="440" y="270" fill="#1E3E62" font-family="Arial, sans-serif" font-size="19" font-weight="700">Kakao Mobility</text>
  <text x="440" y="296" fill="#1E3E62" font-family="Arial, sans-serif" font-size="19" font-weight="700">Directions API</text>
  <text x="440" y="322" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">경로 거리/소요시간 조회</text>

  <rect x="410" y="380" width="240" height="106" rx="10" fill="#E6EDF6" stroke="#315A8A" stroke-width="2"/>
  <text x="440" y="415" fill="#1E3E62" font-family="Arial, sans-serif" font-size="19" font-weight="700">Kakao Local API</text>
  <text x="440" y="441" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">주소 → 좌표 검색</text>

  <rect x="750" y="235" width="270" height="106" rx="10" fill="#E5F0EC" stroke="#176B5F" stroke-width="2"/>
  <text x="780" y="270" fill="#0D433D" font-family="Arial, sans-serif" font-size="19" font-weight="700">예상 거리 / 소요시간</text>
  <text x="780" y="296" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">화면에 km, 분 단위로 표시</text>

  <rect x="750" y="380" width="270" height="106" rx="10" fill="#E5F0EC" stroke="#176B5F" stroke-width="2"/>
  <text x="780" y="415" fill="#0D433D" font-family="Arial, sans-serif" font-size="19" font-weight="700">KakaoMapScreen.js</text>
  <text x="780" y="441" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">GitHub Pages에 호스팅된</text>
  <text x="780" y="461" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">지도 페이지를 WebView로 표시</text>

  <path d="M322 288H398" stroke="#A9562F" stroke-width="3" stroke-linecap="round"/>
  <path d="M390 279L402 288L390 297" stroke="#A9562F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M322 433H398" stroke="#A9562F" stroke-width="3" stroke-linecap="round"/>
  <path d="M390 424L402 433L390 442" stroke="#A9562F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M650 288H738" stroke="#315A8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M730 279L742 288L730 297" stroke="#315A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M650 433H738" stroke="#315A8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M730 424L742 433L730 442" stroke="#315A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="555" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">4-party 앱의 로그인 / 파티 매칭 / 채팅 등 나머지 기능은 팀 저장소(yumin020293-blip/4party, Flutter)에서 팀원이 구현했습니다.</text>
  <text x="92" y="580" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">매칭 결과 화면(MatchScreen)은 실시간 매칭 백엔드 없이 후보 목록 UI를 검증한 프로토타입입니다.</text>
</svg>
