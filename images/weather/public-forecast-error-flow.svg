<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Weather Forecast Error Pipeline</title>
  <desc id="desc">KMA forecast API and ASOS observations are aligned to create a forecast error classification target.</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="70" y="70" width="1060" height="535" rx="18" fill="#FFFFFF" stroke="#DDD7CD" stroke-width="2"/>
  <text x="100" y="124" fill="#0D433D" font-family="Arial, sans-serif" font-size="34" font-weight="700">Weather Forecast Error</text>
  <text x="100" y="158" fill="#5F6268" font-family="Arial, sans-serif" font-size="18">Public API data pipeline for hourly rain forecast error target design</text>
  <rect x="110" y="240" width="205" height="118" rx="10" fill="#E5F0EC" stroke="#176B5F" stroke-width="2"/>
  <text x="143" y="284" fill="#0D433D" font-family="Arial, sans-serif" font-size="20" font-weight="700">KMA Forecast</text>
  <text x="139" y="316" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">getVilageFcst</text>
  <text x="145" y="340" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">forecast_rain</text>
  <rect x="110" y="400" width="205" height="118" rx="10" fill="#E6EDF6" stroke="#315A8A" stroke-width="2"/>
  <text x="152" y="444" fill="#1E3E62" font-family="Arial, sans-serif" font-size="20" font-weight="700">ASOS Hourly</text>
  <text x="139" y="476" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">observed rainfall</text>
  <text x="149" y="500" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">actual_rain</text>
  <rect x="445" y="320" width="220" height="118" rx="10" fill="#F7F5EF" stroke="#DDD7CD" stroke-width="2"/>
  <text x="486" y="364" fill="#171717" font-family="Arial, sans-serif" font-size="20" font-weight="700">Time Alignment</text>
  <text x="480" y="396" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">same station and hour</text>
  <text x="507" y="420" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">Seoul 2025-07</text>
  <rect x="795" y="320" width="230" height="118" rx="10" fill="#FFF8ED" stroke="#A9562F" stroke-width="2"/>
  <text x="833" y="364" fill="#7A3B1E" font-family="Arial, sans-serif" font-size="20" font-weight="700">Target Dataset</text>
  <text x="833" y="396" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">forecast_error = 1</text>
  <text x="822" y="420" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">when forecast != actual</text>
  <path d="M315 299C360 299 390 343 433 362" stroke="#176B5F" stroke-width="3" stroke-linecap="round"/>
  <path d="M423 350L437 364L419 367" stroke="#176B5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M315 459C360 459 390 416 433 397" stroke="#315A8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M419 392L437 395L423 409" stroke="#315A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M665 379H783" stroke="#A9562F" stroke-width="3" stroke-linecap="round"/>
  <path d="M775 370L787 379L775 388" stroke="#A9562F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="145" y="545" width="910" height="38" rx="9" fill="#F2EEE6" stroke="#DDD7CD"/>
  <text x="176" y="570" fill="#171717" font-family="Arial, sans-serif" font-size="17" font-weight="700">Portfolio hooks:</text>
  <text x="335" y="570" fill="#5F6268" font-family="Arial, sans-serif" font-size="16">API ingestion, data validation, label definition, reproducible pipeline</text>
