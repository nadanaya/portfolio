  <rect x="680" y="294" width="104" height="14" rx="7" fill="#2f5f93"/>

  <text x="48" y="382" font-family="Arial, sans-serif" font-size="14" fill="#60646c">근거 파일: rain-error-demo/reports/metrics.json · 소규모 데모 결과이므로 전체 서비스 성능으로 과장하지 않음</text>
