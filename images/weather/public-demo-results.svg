  <text x="48" y="88" font-family="Arial, sans-serif" font-size="15" fill="#60646c">rain-error-demo 샘플 12건 기준 · 최종 프로젝트는 데이터 파이프라인 검증 중심</text>

  <rect x="48" y="126" width="262" height="220" rx="10" fill="#ffffff" stroke="#dedbd2"/>
