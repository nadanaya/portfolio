  <text x="78" y="272" font-family="Arial, sans-serif" font-size="15" fill="#60646c">accuracy</text>
  <rect x="78" y="294" width="180" height="14" rx="7" fill="#e7eef7"/>
  <rect x="78" y="294" width="135" height="14" rx="7" fill="#2f5f93"/>

  <rect x="349" y="126" width="262" height="220" rx="10" fill="#ffffff" stroke="#dedbd2"/>
  <text x="379" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f5f93">오류 발생 비율</text>
  <text x="379" y="235" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#2f5f93">0.50</text>
  <text x="379" y="272" font-family="Arial, sans-serif" font-size="15" fill="#60646c">actual error rate</text>
  <rect x="379" y="294" width="180" height="14" rx="7" fill="#e7eef7"/>
  <rect x="379" y="294" width="90" height="14" rx="7" fill="#2f5f93"/>

  <rect x="650" y="126" width="262" height="220" rx="10" fill="#ffffff" stroke="#dedbd2"/>
  <text x="680" y="166" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#2f5f93">판정 임계값</text>
  <text x="680" y="235" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#2f5f93">0.58</text>
