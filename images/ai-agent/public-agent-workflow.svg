<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent System public workflow diagram</title>
  <desc id="desc">Public recreated workflow showing Discord commands, Python agent, LangGraph, LLM, Supabase PostgreSQL, and Markdown report generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfaf7"/>
      <stop offset="1" stop-color="#e8f1ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b3835" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font:800 42px Inter,Arial,sans-serif;fill:#164c47}
      .subtitle{font:600 18px Inter,Arial,sans-serif;fill:#656565}
      .card{fill:#fff;stroke:#d9d6cf;stroke-width:2;rx:18;filter:url(#shadow)}
      .node-title{font:800 22px Inter,Arial,sans-serif;fill:#171717}
      .node-copy{font:600 15px Inter,Arial,sans-serif;fill:#656565}
      .chip{fill:#e4f0ee;stroke:#b9d5d1;stroke-width:1.5;rx:14}
      .chip-text{font:800 13px Inter,Arial,sans-serif;fill:#164c47}
      .arrow{stroke:#256f68;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .fallback{stroke:#b25f35;stroke-width:4;fill:none;stroke-dasharray:9 9;marker-end:url(#arrow-warm)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#256f68"/>
    </marker>
    <marker id="arrow-warm" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b25f35"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <text x="70" y="76" class="title">AI Agent System Workflow</text>
  <text x="70" y="112" class="subtitle">Discord Bot command to LangGraph workflow, analysis, persistence, and Markdown report output</text>

  <rect x="70" y="175" width="220" height="150" class="card"/>
  <text x="100" y="228" class="node-title">Discord Bot</text>
  <text x="100" y="264" class="node-copy">명령 수신</text>
  <text x="100" y="290" class="node-copy">프로젝트 데이터 입력</text>
  <rect x="100" y="340" width="116" height="28" class="chip"/>
  <text x="118" y="359" class="chip-text">Command</text>

  <rect x="370" y="175" width="230" height="150" class="card"/>
  <text x="402" y="228" class="node-title">Python Agent</text>
  <text x="402" y="264" class="node-copy">회의록 정리</text>
  <text x="402" y="290" class="node-copy">데이터 검증</text>
  <rect x="402" y="340" width="94" height="28" class="chip"/>
  <text x="421" y="359" class="chip-text">Parser</text>

  <rect x="680" y="175" width="230" height="150" class="card"/>
  <text x="712" y="228" class="node-title">LangGraph</text>
  <text x="712" y="264" class="node-copy">작업 흐름 분기</text>
  <text x="712" y="290" class="node-copy">노드별 분석 실행</text>
  <rect x="712" y="340" width="114" height="28" class="chip"/>
  <text x="730" y="359" class="chip-text">Workflow</text>

  <rect x="990" y="175" width="220" height="150" class="card"/>
  <text x="1020" y="228" class="node-title">LLM</text>
  <text x="1020" y="264" class="node-copy">요약 생성</text>
  <text x="1020" y="290" class="node-copy">리스크 분석</text>
  <rect x="1020" y="340" width="100" height="28" class="chip"/>
  <text x="1042" y="359" class="chip-text">Analysis</text>

  <path d="M290 250 H365" class="arrow"/>
  <path d="M600 250 H675" class="arrow"/>
  <path d="M910 250 H985" class="arrow"/>

  <rect x="210" y="465" width="230" height="150" class="card"/>
  <text x="242" y="518" class="node-title">PostgreSQL</text>
  <text x="242" y="554" class="node-copy">프로젝트 상태 저장</text>
  <text x="242" y="580" class="node-copy">기여도 / 일정 기록</text>
  <rect x="242" y="630" width="114" height="28" class="chip"/>
  <text x="260" y="649" class="chip-text">Supabase</text>

  <rect x="530" y="465" width="230" height="150" class="card"/>
  <text x="562" y="518" class="node-title">Report Logic</text>
  <text x="562" y="554" class="node-copy">Action Item 정리</text>
  <text x="562" y="580" class="node-copy">최종 보고서 조립</text>
  <rect x="562" y="630" width="122" height="28" class="chip"/>
  <text x="580" y="649" class="chip-text">Markdown</text>

  <rect x="850" y="465" width="230" height="150" class="card"/>
  <text x="882" y="518" class="node-title">Response</text>
  <text x="882" y="554" class="node-copy">Discord 응답</text>
  <text x="882" y="580" class="node-copy">실패 시 대체 안내</text>
  <rect x="882" y="630" width="108" height="28" class="chip"/>
  <text x="900" y="649" class="chip-text">Fallback</text>

  <path d="M1100 325 C1100 420 980 418 980 465" class="arrow"/>
  <path d="M965 465 H765" class="arrow"/>
  <path d="M530 540 H445" class="arrow"/>
  <path d="M440 540 H525" class="arrow"/>
  <path d="M645 465 C645 390 795 390 795 325" class="arrow"/>
  <path d="M1100 325 C1190 430 1160 575 1080 575" class="fallback"/>
</svg>
