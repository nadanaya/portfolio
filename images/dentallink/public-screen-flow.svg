<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DentalLink public screen flow</title>
  <desc id="desc">Public-safe recreated DentalLink patient app and admin waiting management flow.</desc>
  <rect width="1200" height="760" fill="#f7fbfb"/>
  <text x="64" y="78" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#143b45">DentalLink Screen Flow</text>
  <text x="64" y="112" font-family="Arial, sans-serif" font-size="17" fill="#587078">환자 앱 예약·대기 확인과 관리자 대기 관리 흐름을 공개용으로 재구성한 화면 개요</text>

  <g transform="translate(64 164)">
