<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SilentOrchestra 2.0 Gesture Observation Flow</title>
  <desc id="desc">Webcam gesture client extracts motion features with OpenCV, posts them to a FastAPI observation API, which stores gesture and context memory in SQLite before pattern, suggestion, and execution steps.</desc>
  <rect width="1200" height="675" fill="#FAF8F3"/>
  <rect x="64" y="70" width="1072" height="535" rx="18" fill="#FFFFFF" stroke="#DDD7CD" stroke-width="2"/>
  <text x="92" y="123" fill="#0D433D" font-family="Arial, sans-serif" font-size="34" font-weight="700">SilentOrchestra 2.0</text>
  <text x="92" y="157" fill="#5F6268" font-family="Arial, sans-serif" font-size="18">Local-first spatial AI agent that learns repeated gestures and usage context</text>

  <rect x="92" y="220" width="220" height="120" rx="10" fill="#E5F0EC" stroke="#176B5F" stroke-width="2"/>
  <text x="120" y="262" fill="#0D433D" font-family="Arial, sans-serif" font-size="20" font-weight="700">Gesture Client</text>
  <text x="120" y="290" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">OpenCV webcam capture</text>
  <text x="120" y="312" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">optical flow per frame</text>

  <rect x="372" y="205" width="240" height="150" rx="10" fill="#F7F5EF" stroke="#DDD7CD" stroke-width="2"/>
  <text x="400" y="245" fill="#171717" font-family="Arial, sans-serif" font-size="19" font-weight="700">Motion Features</text>
  <text x="400" y="272" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">moving pixels only</text>
  <text x="400" y="294" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">MOG2 foreground mask</text>
  <text x="400" y="316" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">multi-frame direction</text>

  <rect x="672" y="220" width="230" height="120" rx="10" fill="#E6EDF6" stroke="#315A8A" stroke-width="2"/>
  <text x="700" y="262" fill="#1E3E62" font-family="Arial, sans-serif" font-size="20" font-weight="700">FastAPI</text>
  <text x="700" y="290" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">observation API</text>
  <text x="700" y="312" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">POST /observations</text>

  <rect x="962" y="220" width="150" height="120" rx="10" fill="#FFF8ED" stroke="#A9562F" stroke-width="2"/>
  <text x="990" y="262" fill="#7A3B1E" font-family="Arial, sans-serif" font-size="20" font-weight="700">SQLite</text>
  <text x="990" y="290" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">SQLAlchemy</text>
  <text x="990" y="312" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">context memory</text>

  <path d="M312 280H366" stroke="#176B5F" stroke-width="3" stroke-linecap="round"/>
  <path d="M358 271L370 280L358 289" stroke="#176B5F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M612 280H666" stroke="#315A8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M658 271L670 280L658 289" stroke="#315A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M902 280H956" stroke="#A9562F" stroke-width="3" stroke-linecap="round"/>
  <path d="M948 271L960 280L948 289" stroke="#A9562F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="372" y="392" width="740" height="70" rx="10" fill="#F2EEE6" stroke="#DDD7CD"/>
  <text x="404" y="424" fill="#171717" font-family="Arial, sans-serif" font-size="17" font-weight="700">Pattern</text>
  <text x="486" y="424" fill="#5F6268" font-family="Arial, sans-serif" font-size="16">3 repeats -&gt; Suggestion -&gt; user approval -&gt; Execution -&gt; Feedback</text>
  <text x="404" y="448" fill="#5F6268" font-family="Arial, sans-serif" font-size="14">no raw frames or face data stored, motion features and context only</text>
  <path d="M792 355V388" stroke="#315A8A" stroke-width="3" stroke-linecap="round"/>
  <path d="M783 380L792 392L801 380" stroke="#315A8A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="92" y="500" width="1020" height="62" rx="10" fill="#F2EEE6" stroke="#DDD7CD"/>
  <text x="124" y="538" fill="#171717" font-family="Arial, sans-serif" font-size="18" font-weight="700">My contribution:</text>
  <text x="300" y="538" fill="#5F6268" font-family="Arial, sans-serif" font-size="16">moving-pixel optical flow (PR #1), MOG2 foreground + multi-frame direction check (PR #8)</text>
</svg>
